[package]
name = "nexus-desktop"
version = "1.0.0"
description = "Nexus — Plataforma de Gerenciamento de Projetos Técnicos (Vaultra)"
authors = ["Carlos Henrique / Vaultra"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
