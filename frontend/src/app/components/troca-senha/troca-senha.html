<div class="troca-senha-container">

  <div class="troca-senha-card">

    <!-- Header -->
    <div class="troca-senha-header">
      <div class="troca-senha-icon">
        <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1>Troca de Senha</h1>
      <p class="troca-senha-subtitle">
        Sua conta requer uma troca de senha antes de continuar.
        Escolha uma senha segura com no mínimo 6 caracteres.
      </p>
    </div>

    <!-- Alerts -->
    @if (error()) {
    <div class="alert alert-error">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      {{ error() }}
    </div>
    }

    @if (success()) {
    <div class="alert alert-success">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      {{ success() }}
    </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="troca-senha-form">

      <div class="form-group">
        <label for="senha-atual">Senha Atual</label>
        <input
          id="senha-atual"
          type="password"
          placeholder="Digite sua senha atual"
          [value]="senhaAtual()"
          (input)="senhaAtual.set($any($event.target).value)"
          autocomplete="current-password"
        />
      </div>

      <div class="form-group">
        <label for="nova-senha">Nova Senha</label>
        <input
          id="nova-senha"
          type="password"
          placeholder="Mínimo 6 caracteres"
          [value]="novaSenha()"
          (input)="novaSenha.set($any($event.target).value)"
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmar-senha">Confirmar Nova Senha</label>
        <input
          id="confirmar-senha"
          type="password"
          placeholder="Repita a nova senha"
          [value]="confirmarSenha()"
          (input)="confirmarSenha.set($any($event.target).value)"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          Alterando...
        } @else {
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5 13l4 4L19 7" />
          </svg>
          Alterar Senha
        }
      </button>

    </form>

  </div>

</div>
